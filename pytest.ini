[pytest]
testpaths = tests
# Several tests are `async def` without a marker. Without this they are collected
# but never awaited, and pytest reports them as failures.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    eval: offline replay evaluation of image selection (tests/eval); no network, keys or database; runs in CI
    network: makes live calls to real providers or APIs; deselected by default, run with -m network
addopts = -m "not network"
