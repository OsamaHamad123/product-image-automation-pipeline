# nginx site for the Laqta dashboard (Laravel behind php-fpm).
#
# SECURITY: the dashboard has NO login of its own. Whoever reaches it can approve, publish and write the Google
# Sheet. This site therefore requires HTTP basic auth on EVERY request (the password file is created by
# install.sh with htpasswd, typed interactively) and must be served over HTTPS (certbot: docs/deploy_ubuntu.md).
# Basic auth over plain HTTP sends the password in the clear: never use the port-80 form on the open internet.
# Alternative with no public exposure: install.sh --local-only (127.0.0.1:8080) + an SSH tunnel or Tailscale.
#
# The @NAME@ words below are filled in by install.sh: the listen lines (port 80, or 443 with the certificate once
# `certbot certonly --webroot` has issued one), the server name, the app folder, the php-fpm socket, and at the end
# the port-80 redirect server (empty until a certificate exists). install.sh owns this file: re-running it keeps
# HTTPS in place.

server {
    @LISTEN@
    server_name @SERVER_NAME@;

    # Only dashboard/public is ever served: the Python code, .env, credentials.json, vendor/ and storage/ sit
    # outside the web root.
    root @APP_DIR@/dashboard/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 20m;

    # Authentication for the whole site (inherited by every location below unless it says "auth_basic off").
    auth_basic "Laqta";
    auth_basic_user_file /etc/nginx/laqta.htpasswd;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # certbot HTTP-01 challenge (certbot ... --webroot -w /var/www/letsencrypt): Let's Encrypt cannot log in,
    # so this single path is open. It serves nothing but the challenge token files.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Deny every other dotfile (.env, .git, .htaccess ...).
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Deny the Laravel folders and typical secret / dump file types even if one ever lands under public/.
    location ~ ^/(storage|vendor|bootstrap|app|config|database|routes|tests|temp|runs)(/|$) {
        deny all;
        return 404;
    }
    location ~* \.(env|sql|log|bak|old|orig|swp|ini|lock|ya?ml|md|json|py|sh|ps1|bat|db)$ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # Only /index.php is executed. Any other .php path is refused.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:@PHP_SOCKET@;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # PythonBridge allows one action 600 seconds; the worker start and the bridge calls can be long.
        fastcgi_read_timeout 900s;
        fastcgi_send_timeout 900s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
    location ~ \.php$ {
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    access_log /var/log/nginx/laqta.access.log;
    error_log  /var/log/nginx/laqta.error.log;
}

@REDIRECT_SERVER@
