# nginx site for the Laqta dashboard (Laravel behind php-fpm).
#
# SECURITY: the dashboard has NO login of its own. Whoever reaches it can approve, publish and write the Google
# Sheet. This site therefore requires HTTP basic auth on EVERY request (the password file is created by
# install.sh with htpasswd, typed interactively) and is only ever served over HTTPS or on 127.0.0.1:
#   * install.sh --domain HOST    port 443 with the certbot certificate; port 80 only answers the certbot challenge
#                                 and redirects to HTTPS. Until the certificate exists the dashboard listens on
#                                 127.0.0.1:8080 only (port 80 serves no dashboard and no login form).
#   * install.sh --local-only     127.0.0.1:8080 + an SSH tunnel or Tailscale, no public port at all.
# install.sh refuses to finish with neither: a shared password over plain HTTP is not acceptable.
#
# Brute-force protection: limit_req below throttles every client address (a flood of wrong passwords included),
# and the optional fail2ban jail (install.sh --with-fail2ban, laqta-fail2ban.conf) bans addresses that keep
# sending a wrong password.
#
# The @NAME@ words below are filled in by install.sh: the listen lines, the server name, the app folder, the
# php-fpm socket, the monitor addresses allowed to read /healthz, and at the end the port-80 server (redirect once
# a certificate exists, challenge-only before). install.sh owns this file: re-running it keeps HTTPS in place.

# Request limits (this file is included inside http {}). Generous on purpose: one review page loads dozens of
# images through /api/image-proxy at once and the run page polls every few seconds.
limit_req_zone $binary_remote_addr zone=laqta_req:10m rate=10r/s;
# A request with no Authorization header at all can only get the 401 page: allow few per minute and address (a
# browser sends it once, then repeats the request with the password). The key is empty - not counted - for
# any request that carries credentials.
map $http_authorization $laqta_noauth_key {
    default "";
    ""      $binary_remote_addr;
}
limit_req_zone $laqta_noauth_key zone=laqta_noauth:1m rate=30r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
    @LISTEN@
    server_name @SERVER_NAME@;

    # Only dashboard/public is ever served: the Python code, .env, credentials.json, vendor/ and storage/ sit
    # outside the web root.
    root @APP_DIR@/dashboard/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 20m;    # php-fpm pool: upload_max_filesize 20M, post_max_size 25M (laqta-fpm-pool.conf)

    # Every location below that sends no limit_req of its own is throttled here (the authenticated ones).
    limit_req zone=laqta_req burst=60 nodelay;
    limit_req zone=laqta_noauth burst=10 nodelay;

    # Authentication for the whole site (inherited by every location below unless it says "auth_basic off").
    auth_basic "Laqta";
    auth_basic_user_file /etc/nginx/laqta.htpasswd;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # certbot HTTP-01 challenge (certbot ... --webroot -w /var/www/letsencrypt): Let's Encrypt cannot log in,
    # so this single path is open. It serves nothing but the challenge token files.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Health check for an uptime monitor (docs/deploy_ubuntu.md): JSON with no secrets (database ping, age of the last
    # good night, dead sheet writes, free disk), HTTP 200 when everything is fine and 503 when not. No password,
    # so ONLY this machine and the monitor addresses given to install.sh (--monitor-ip) may call it.
    location = /healthz {
        auth_basic off;
        allow 127.0.0.1;
        allow ::1;
@MONITOR_ALLOW@
        deny all;
        limit_req zone=laqta_req burst=10 nodelay;
        include fastcgi_params;
        fastcgi_pass unix:@PHP_SOCKET@;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 20s;
    }

    # Deny every other dotfile (.env, .git, .htaccess ...).
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Deny the Laravel folders and typical secret / dump file types even if one ever lands under public/.
    location ~ ^/(storage|vendor|bootstrap|app|config|database|routes|tests|temp|runs)(/|$) {
        deny all;
        return 404;
    }
    location ~* \.(env|sql|log|bak|old|orig|swp|ini|lock|ya?ml|md|json|py|sh|ps1|bat|db)$ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # Only /index.php is executed. Any other .php path is refused.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:@PHP_SOCKET@;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # PythonBridge allows one action 600 seconds; the worker start and the bridge calls can be long.
        fastcgi_read_timeout 900s;
        fastcgi_send_timeout 900s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
    location ~ \.php$ {
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    access_log /var/log/nginx/laqta.access.log;
    error_log  /var/log/nginx/laqta.error.log;
}

@REDIRECT_SERVER@
