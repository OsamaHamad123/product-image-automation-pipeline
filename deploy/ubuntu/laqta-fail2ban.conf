# fail2ban jail for the Laqta dashboard (optional: install.sh --with-fail2ban copies it to /etc/fail2ban/jail.d/laqta.conf).
#
# The dashboard has ONE shared login (nginx basic auth). nginx writes every wrong password to the site's error log:
#     user "admin": password mismatch, client: 203.0.113.9, server: dash.example.com, request: "GET / HTTP/1.1", ...
# fail2ban's stock filter nginx-http-auth reads exactly those lines. 5 wrong passwords within 10 minutes from one
# address ban that address from the web ports for 1 hour (a second ban for the same address lasts longer: bantime.increment).
# A browser that has no password yet only gets "401 + password prompt", which is not a failure and is never counted.
# Check it:  sudo fail2ban-client status laqta-nginx-auth      Unban:  sudo fail2ban-client set laqta-nginx-auth unbanip ADDRESS
# Do NOT add your own address to a tunnel/Tailscale setup this way: with --local-only every visitor is 127.0.0.1.
[laqta-nginx-auth]
enabled = true
filter = nginx-http-auth
port = http,https
logpath = /var/log/nginx/laqta.error.log
backend = auto
maxretry = 5
findtime = 10m
bantime = 1h
bantime.increment = true
bantime.maxtime = 1w
