; php-fpm pool for the Laqta dashboard. install.sh copies it to /etc/php/<version>/fpm/pool.d/laqta.conf.
;
; The pool runs as the app user (not www-data) on purpose: the dashboard starts Python (cli_bridge.py, the
; background worker) through shell_exec, and those processes must read .env and credentials.json and write
; temp/ and runs/ exactly like the nightly unit does (same user, files stay 600, no shared-group tricks).
; nginx (www-data) only talks to the socket and reads dashboard/public.
; The @NAME@ words are filled in by install.sh.
[laqta]
user = @APP_USER@
group = @APP_USER@

listen = @PHP_SOCKET@
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; One dashboard action may call Python for up to 600 s (PythonBridge::TIME_LIMIT).
request_terminate_timeout = 900s
security.limit_extensions = .php

clear_env = yes
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[HOME] = @APP_HOME@
env[PYTHONUTF8] = 1
env[PYTHONIOENCODING] = utf-8
; rembg / BiRefNet model files (same folder the units and install.sh --with-birefnet use)
env[U2NET_HOME] = @MODELS_DIR@
; Tells the dashboard (dashboard/app/Services/RunLauncher.php) that laqta-run.path / laqta-run.service are installed:
; a run started from the dashboard then goes through systemd and survives a php-fpm restart. Without this line (or
; when the launcher does not answer in a few seconds) the dashboard starts the worker itself, the old way.
env[LAQTA_RUN_LAUNCHER] = systemd

php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off

; Uploads: the PHP defaults (2M file / 8M request) are below nginx's client_max_body_size of 20m, so a manual image
; over 2 MB used to fail with "No file uploaded". post_max_size is larger than the file limit on purpose
; (the multipart envelope and the other form fields travel in the same request).
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
