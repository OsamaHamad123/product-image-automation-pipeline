; php-fpm pool for the Laqta dashboard. install.sh copies it to /etc/php/<version>/fpm/pool.d/laqta.conf.
;
; The pool runs as the app user (not www-data) on purpose: the dashboard starts Python (cli_bridge.py, the
; background worker) through shell_exec, and those processes must read .env and credentials.json and write
; temp/ and runs/ exactly like the nightly unit does (same user, files stay 600, no shared-group tricks).
; nginx (www-data) only talks to the socket and reads dashboard/public.
; The @NAME@ words are filled in by install.sh.
[laqta]
user = @APP_USER@
group = @APP_USER@

listen = @PHP_SOCKET@
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; One dashboard action may call Python for up to 600 s (PythonBridge::TIME_LIMIT).
request_terminate_timeout = 900s
security.limit_extensions = .php

clear_env = yes
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[HOME] = @APP_HOME@
env[PYTHONUTF8] = 1
env[PYTHONIOENCODING] = utf-8
; rembg / BiRefNet model files (same folder the units and install.sh --with-birefnet use)
env[U2NET_HOME] = @MODELS_DIR@

php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
